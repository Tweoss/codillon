name: Simple CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Chromium + required shared libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chromium-browser \
            libnss3 libatk-bridge2.0-0 libgtk-3-0 \
            libx11-xcb1 libxcomposite1 libxdamage1 libxext6 \
            libxfixes3 libxi6 libxrandr2 libxss1 libxtst6 \
            libgbm1 fonts-liberation ca-certificates xdg-utils

      - name: Create .env and export it
        shell: bash
        run: |
          cat <<'EOF' > .env
          BROWSER_PATH=/usr/bin/chromium-browser
          # CHROME_ARGS="--no-sandbox --disable-setuid-sandbox"
          EOF

          # Export every key=value line in .env to subsequent steps
          set -a
          source .env
          set +a
          cat .env >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install just
        run: |
          curl -sL https://just.systems/install.sh | bash -s -- --to /usr/local/bin

      - name: Install project dependencies
        run: npm ci

      - name: Start web server
        shell: bash
        run: |
          # 1) launch the app in the background
          just serve &
          SERVE_PID=$!

          # 2) poll until it responds or 30 s pass
          for i in {1..30}; do
            if curl -sf http://localhost:8080 >/dev/null; then
              echo "Server is up ✅"
              break
            fi
            echo "Waiting for server on port 8080… ($i/30)"
            sleep 1
          done

          # 3) expose the PID so a later step can clean up
          echo "SERVE_PID=$SERVE_PID" >> "$GITHUB_ENV"

      - name: Run test suite
        run: just test

      - name: Stop web server
        if: always()
        run: |
          if [[ -n "$SERVE_PID" ]]; then
            kill "$SERVE_PID" || true
          fi

      # - name: Install Xvfb
      #   run: sudo apt-get install -y xvfb # tiny (≈ 8 MB) virtual X server

      # - name: Run test suite in a virtual display

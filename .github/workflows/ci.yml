name: Simple CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Chromium + required shared libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chromium-browser \
            libnss3 libatk-bridge2.0-0 libgtk-3-0 \
            libx11-xcb1 libxcomposite1 libxdamage1 libxext6 \
            libxfixes3 libxi6 libxrandr2 libxss1 libxtst6 \
            libgbm1 fonts-liberation ca-certificates xdg-utils

      - name: Create .env and export it
        shell: bash
        run: |
          cat <<'EOF' > .env
          BROWSER_PATH=/usr/bin/chromium-browser
          CHROME_ARGS=--no-sandbox --disable-setuid-sandbox
          EOF

          # Export every key=value line in .env to subsequent steps
          set -a
          source .env
          set +a
          cat .env >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install just
        run: |
          curl -sL https://just.systems/install.sh | bash -s -- --to /usr/local/bin

      - name: Install project dependencies
        run: npm ci

      - name: Run test suite
        run: just test "$BROWSER_PATH" $CHROME_ARGS
